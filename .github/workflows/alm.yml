# Gates of the simsopt-alm package (packages/simsopt-alm: the ALM solver
# simsopt_alm, its tests and examples) and of the simsopt-alm-setup skill.
# The package installs beside any simsopt, so each job installs a simsopt
# first and the package on top, non-editable, and runs the package's tests
# from packages/simsopt-alm (they import the installed package). Four jobs:
#
# package: Python 3.11 with simsopt built from this checkout: every package
#   test, including the examples (test_alm_examples.py runs the Stage-2 and
#   Boozer demos at their CI size; the Boozer demo is bounded by evaluations)
#   and the skill's tests; then the sdist is built, installed and extracted,
#   and the golden and example tests run from the extracted copy (MANIFEST.in
#   must ship tests/alm_golden and examples).
#
# stock-simsopt: the same tests in a clean environment whose simsopt is the
#   stock upstream release from PyPI, the case of a user who installs the
#   package next to someone else's simsopt.
#
# python38: the declared Python floor (requires-python = ">=3.8"). Upstream
#   simsopt's isolated build needs numpy >= 2, which has no Python 3.8
#   release, so the build dependencies are installed first (numpy 1.24.4,
#   SciPy 1.10.1, jax/jaxlib 0.4.13 from Google's jax-releases page) and
#   simsopt builds without isolation.
#
# golden-exact-replay: the bitwise replay of tests/alm_golden, which runs only
#   under the numpy, SciPy, machine and OpenBLAS kernel family the goldens
#   were recorded with and otherwise skips. The goldens are recorded with one
#   thread per library and OpenBLAS's Haswell kernels pinned (AVX2 and FMA,
#   which every x86-64-v3 runner has; numpy's own AVX-512 dispatch does not
#   change the replay). This job installs exactly the versions manifest.json
#   records and the package alone (the goldens need no simsopt), sets the same
#   variables, and fails (not skips) when the replay does not run.

name: ALM

on:
  push:
    # A tags filter alone makes GitHub skip every branch push; tests.yml
    # pairs its tag filter with a branch filter the same way.
    branches: ['**']
    tags-ignore: [v*]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: simsopt-alm on this checkout's simsopt
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: 4
      PYTHON: ${{ github.workspace }}/.venv-alm/bin/python

    steps:
    - uses: actions/checkout@v4
      with:
        # setuptools_scm derives simsopt's version from the tags.
        fetch-depth: 0
        submodules: recursive

    - uses: astral-sh/setup-uv@v6

    - name: Install Boost headers
      run: sudo apt-get update && sudo apt-get install -y libboost-dev

    - name: Install simsopt from this checkout, then the package
      run: |
        uv venv --python 3.11 .venv-alm
        uv pip install --python "$PYTHON" . pytest
        uv pip install --python "$PYTHON" ./packages/simsopt-alm

    - name: Run the package tests
      working-directory: packages/simsopt-alm
      run: |
        "$PYTHON" -m pytest -q -rs tests

    - name: Run the golden and example tests from the extracted sdist
      run: |
        uv build --sdist --out-dir "$RUNNER_TEMP/sdist" packages/simsopt-alm
        sdist=$(ls "$RUNNER_TEMP"/sdist/simsopt_alm-*.tar.gz)
        tar -tzf "$sdist" | grep -q '/tests/alm_golden/manifest.json$'
        tar -tzf "$sdist" | grep -q '/examples/boozerQA_alm.py$'
        uv pip install --python "$PYTHON" --reinstall-package simsopt-alm "$sdist"
        mkdir "$RUNNER_TEMP/extracted"
        tar -xzf "$sdist" -C "$RUNNER_TEMP/extracted"
        cd "$RUNNER_TEMP"/extracted/simsopt_alm-*/
        "$PYTHON" -m pytest -q -rs tests/test_alm_golden_trajectories.py tests/test_alm_examples.py \
          tests/test_alm_composition_example.py

  stock-simsopt:
    name: simsopt-alm beside stock PyPI simsopt
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: 4
      PYTHON: ${{ github.workspace }}/.venv-stock/bin/python

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v6

    - name: Install stock simsopt from PyPI into a clean environment
      run: |
        uv venv --python 3.11 .venv-stock
        uv pip install --python "$PYTHON" --no-cache simsopt pytest

    - name: Install the package on top
      run: uv pip install --python "$PYTHON" ./packages/simsopt-alm

    - name: Require stock simsopt and a solver import free of simsopt
      run: |
        "$PYTHON" - <<'EOF'
        import importlib.metadata
        import json
        import subprocess
        import sys
        import simsopt
        import simsopt_alm
        import simsopt_alm.signed_constraints
        direct_url = importlib.metadata.distribution("simsopt").read_text("direct_url.json")
        print("simsopt", importlib.metadata.version("simsopt"), simsopt.__file__, "direct_url", direct_url)
        print("simsopt_alm", importlib.metadata.version("simsopt-alm"), simsopt_alm.__file__)
        if direct_url is not None:
            sys.exit("simsopt was not installed from an index")
        probe = ("import json, sys, simsopt_alm; print(json.dumps(sorted(name for name in sys.modules "
                 "if name == 'simsopt' or name.startswith('simsopt.'))))")
        loaded = json.loads(subprocess.run([sys.executable, "-c", probe], capture_output=True,
                                           text=True, check=True).stdout)
        print("simsopt modules loaded by import simsopt_alm:", loaded)
        sys.exit(f"import simsopt_alm loaded {loaded}" if loaded else 0)
        EOF

    - name: Run the package tests
      working-directory: packages/simsopt-alm
      run: |
        "$PYTHON" -m pytest -q -rs tests

  python38:
    name: simsopt-alm on Python 3.8
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: 4
      PYTHON: ${{ github.workspace }}/.venv-alm/bin/python

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - uses: astral-sh/setup-uv@v6

    - name: Install Boost headers
      run: sudo apt-get update && sudo apt-get install -y libboost-dev

    - name: Create a Python 3.8 environment
      run: uv venv --python 3.8 .venv-alm

    - name: Install the build dependencies
      run: |
        uv pip install --python "$PYTHON" numpy==1.24.4 scipy==1.10.1 scikit-build-core "pybind11<3.0.0" \
          "setuptools_scm>=8.0" tomli cmake ninja setuptools pytest
        uv pip install --python "$PYTHON" jax==0.4.13 jaxlib==0.4.13 \
          -f https://storage.googleapis.com/jax-releases/jax_releases.html

    - name: Build and install simsopt without build isolation, then the package
      run: |
        uv pip install --python "$PYTHON" --no-build-isolation .
        uv pip install --python "$PYTHON" ./packages/simsopt-alm

    - name: Import the package on Python 3.8
      run: |
        "$PYTHON" - <<'EOF'
        import sys
        import numpy, scipy, jax
        import simsopt
        import simsopt_alm as alm
        import simsopt_alm.signed_constraints as signed_constraints
        assert sys.version_info[:2] == (3, 8), sys.version
        print(sys.version.split()[0], "numpy", numpy.__version__, "scipy", scipy.__version__, "jax", jax.__version__)
        print("simsopt", simsopt.__file__)
        print("alm", alm.__file__, len(alm.__all__), "names")
        print("signed_constraints", signed_constraints.__file__)
        EOF

    - name: Run the package tests (examples excluded)
      working-directory: packages/simsopt-alm
      run: |
        "$PYTHON" -m pytest -q -rs tests \
          --ignore=tests/test_alm_examples.py \
          --ignore=tests/test_alm_composition_example.py

  golden-exact-replay:
    name: ALM golden exact replay
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      # The recording pin (manifest.json openblas_coretype; checked below).
      OPENBLAS_CORETYPE: Haswell
      PYTHON: ${{ github.workspace }}/.venv-golden/bin/python
      GOLDEN_DIR: ${{ github.workspace }}/packages/simsopt-alm/tests/alm_golden

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v6

    - name: Read the recording environment from the manifest
      id: recorded
      run: |
        python3 - <<'EOF' >> "$GITHUB_OUTPUT"
        import json, os
        environment = json.load(open(os.path.join(os.environ["GOLDEN_DIR"], "manifest.json")))["environment"]
        print("python=" + ".".join(environment["python"].split(".")[:2]))
        print("numpy=" + environment["numpy"])
        print("scipy=" + environment["scipy"])
        print("machine=" + environment["machine"])
        print("openblas_coretype=" + str(environment["openblas_coretype"]))
        EOF
        cat "$GITHUB_OUTPUT"

    - name: Require the recorded machine and OpenBLAS kernel pin
      run: |
        if [ "$(uname -m)" != "${{ steps.recorded.outputs.machine }}" ]; then
          echo "runner machine $(uname -m) is not the recorded ${{ steps.recorded.outputs.machine }}"
          exit 1
        fi
        if [ "$OPENBLAS_CORETYPE" != "${{ steps.recorded.outputs.openblas_coretype }}" ]; then
          echo "OPENBLAS_CORETYPE=$OPENBLAS_CORETYPE is not the recorded ${{ steps.recorded.outputs.openblas_coretype }}"
          exit 1
        fi

    - name: Require the AVX2 and FMA the pinned Haswell kernels need
      run: |
        grep -m1 "model name" /proc/cpuinfo
        for flag in avx2 fma; do
          if ! grep -qw "$flag" /proc/cpuinfo; then
            echo "this runner has no $flag: OpenBLAS's Haswell kernels cannot run"
            exit 1
          fi
        done

    - name: Create the environment with the recorded numpy and SciPy
      run: |
        uv venv --python "${{ steps.recorded.outputs.python }}" .venv-golden
        printf 'numpy==%s\nscipy==%s\n' "${{ steps.recorded.outputs.numpy }}" \
          "${{ steps.recorded.outputs.scipy }}" > golden-constraints.txt
        uv pip install --python "$PYTHON" -c golden-constraints.txt numpy scipy pytest ./packages/simsopt-alm

    - name: Require the bitwise environment
      run: |
        "$PYTHON" - <<'EOF'
        import os, sys
        sys.path.insert(0, os.environ["GOLDEN_DIR"])
        import alm_golden_scenarios as golden
        print("current ", golden.current_environment())
        print("recorded", golden.recorded_environment())
        sys.exit(0 if golden.bitwise_environment() else "not the recorded environment: the replay would skip")
        EOF
        # numpy and SciPy each load OpenBLAS; both must run the pinned kernels.
        cores=$(OPENBLAS_VERBOSE=2 "$PYTHON" -c "import numpy.linalg, scipy.linalg" 2>&1 | grep '^Core: ' | sort -u)
        echo "$cores"
        [ "$cores" = "Core: $OPENBLAS_CORETYPE" ]

    - name: Run the golden tests
      working-directory: packages/simsopt-alm
      run: |
        "$PYTHON" -m pytest -q -rs tests/test_alm_golden_trajectories.py --junitxml="$GITHUB_WORKSPACE/golden-junit.xml"

    - name: Fail unless every bitwise replay ran and passed
      run: |
        "$PYTHON" - <<'EOF'
        import os, sys
        import xml.etree.ElementTree as ElementTree
        sys.path.insert(0, os.environ["GOLDEN_DIR"])
        import alm_golden_scenarios as golden
        # One bitwise test per scenario, test_<scenario name>; each must pass,
        # not skip.
        cases = [case for case in ElementTree.parse("golden-junit.xml").iter("testcase")
                 if case.get("classname", "").endswith(".AlmGoldenReplayTests")]
        passed = {case.get("name") for case in cases
                  if not any(case.find(tag) is not None for tag in ("skipped", "failure", "error"))}
        missing = sorted(f"test_{scenario.name}" for scenario in golden.SCENARIOS
                         if f"test_{scenario.name}" not in passed)
        print(f"{len(passed)} of {len(cases)} bitwise replay tests passed; "
              f"scenarios without a passed bitwise replay: {missing}")
        sys.exit("the bitwise replay did not run and pass for every scenario" if missing else 0)
        EOF
